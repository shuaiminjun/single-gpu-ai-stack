[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gpu-orchestra"
version = "0.1.0"
description = "Single-GPU multi-model serving layer with OpenAI-compatible chat/audio endpoints, VRAM budget scheduling and first-chunk latency metrics. Zero runtime dependencies."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "HsM" }]
keywords = ["llm", "serving", "openai-compatible", "tts", "vram", "single-gpu"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
orchestra = "orchestra.cli:main"

[tool.setuptools.packages.find]
include = ["orchestra*"]
