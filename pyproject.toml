[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "single-gpu-ai-stack"
version = "0.1.0"
description = "One 20GB GPU, one OpenAI-compatible gateway for chat / image / audio: VRAM budget scheduling, LRU eviction, streaming SSE and chunked WAV. Zero runtime dependencies."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "HsM" }]
keywords = ["llm", "serving", "openai-compatible", "tts", "vram", "single-gpu"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ai-stack = "core.cli:main"

[tool.setuptools.packages.find]
include = ["core*"]
